name: crossfit_box
description: A modern CrossFit box management app with social features and gamification
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10
  cloud_functions: ^4.6.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.66.0
  confetti: ^0.7.0
  lottie: ^3.0.0
  glassmorphism: ^3.0.0

  # Navigation
  go_router: ^13.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  image_picker: ^1.0.7
  share_plus: ^7.2.1
  url_launcher: ^6.2.3
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2

  # Icons & Animations
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
